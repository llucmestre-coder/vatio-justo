# Cloudflare Pages (connectat a GitHub). Web estàtica a l'arrel + Functions a /functions.
# Secrets (NO aquí: el repo és públic) — `wrangler pages secret put <NOM> --project-name vatio-justo`:
#   TURNSTILE_SECRET, BREVO_API_KEY, BREVO_SENDER, WHATSAPP, ADMIN_PASSWORD
name = "vatio-justo"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "CODIS"
id = "58d56ec6be554474ae0ed20fffd5ff4f"

# Contactes de la calculadora (seguiment). Esquema: schema.sql. Llista privada a /admin.
[[d1_databases]]
binding = "LEADS"
database_name = "vatio-justo-leads"
database_id = "fece3284-b8e5-4cc3-9a09-ef145de2d167"
